[project]
name = "cycle-core"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Нелин Матвей", email = "nelinmatvey@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
cycle-core = "cycle_core:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.19.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "genbadge[coverage]>=1.1.1",
    "ruff>=0.16.5",
]
