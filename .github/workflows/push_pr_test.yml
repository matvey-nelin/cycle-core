name: Tests & Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cycle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cycle_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cycle_test
      
      - name: Run tests
        run: pytest -q -v
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cycle_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cycle_test

  coverage-badge:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cycle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov coverage-badge setuptools
          pip install -r requirements.txt
          
      - name: Run tests with coverage
        run: pytest --cov=api --cov=domain --cov=services --cov=infrastructure --cov-report=xml
        env: 
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cycle_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cycle_test
          
      - name: Generate coverage badge
        run: |
          mkdir -p docs
          coverage-badge -o docs/coverage.svg -f
          
      - name: Commit badge
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/coverage.svg
          git diff --staged --quiet || git commit -m "docs: update coverage badge [skip ci]"
          git push