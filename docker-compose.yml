version: "3.9"

services: 
  db: 
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cycle
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 0s
  
  migrate:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/cycle
    depends_on:
      db: 
        condition: service_healthy
    command: ["alembic", "upgrade", "head"] 

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/cycle
    depends_on:
      migrate: 
        condition: service_completed_successfully
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
